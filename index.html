<title>Edinburgh, 10 to 18 December 2026</title>

<style>
:root{
  --bg:#eef0f4; --surface:#ffffff; --ink:#1b2230; --muted:#586272; --line:#d6dbe4;
  --accent:#5b3a73; --accent-ink:#ffffff; --amber:#935606; --chip:#e1e5ec; --bad:#b3261e;
  --dusk1:#2a2440; --dusk2:#5b3a73; --dusk3:#d98f4e;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161e; --surface:#1b212c; --ink:#e9edf3; --muted:#a2adbc; --line:#2d3646;
    --accent:#cfa9e3; --accent-ink:#1a1022; --amber:#e3a95d; --chip:#252d3b; --bad:#ff8a80;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:72px; -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

.hero{position:relative; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 36px) 20px 0;
  background:linear-gradient(180deg,var(--dusk1) 0%,var(--dusk2) 62%,var(--dusk3) 100%); overflow:hidden}
.hero h1{font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,11vw,4.4rem); line-height:1; margin:0 0 10px}
.hero p{margin:0; max-width:34ch; font-size:1.02rem; color:#f1e9f6}
.hero svg{display:block; width:calc(100% + 40px); margin:26px -20px 0; height:auto}
.wrap{max-width:760px; margin:0 auto; padding:0 16px}

nav{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
nav ul{list-style:none; margin:0 auto; padding:10px 16px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; max-width:760px; position:relative}
nav ul::-webkit-scrollbar{display:none}
nav a{display:block; white-space:nowrap; text-decoration:none; background:var(--chip); color:var(--ink);
  padding:7px 13px; border-radius:999px; font-size:.92rem; font-weight:500}
nav a.on{background:var(--accent); color:var(--accent-ink)}
nav li.gap{margin-left:10px; padding-left:10px; border-left:1px solid var(--line)}

section.day{padding:34px 0 6px}
.day h2{font-family:var(--serif); font-weight:400; font-size:1.7rem; line-height:1.15; margin:0 0 6px}
.day h3.sub{font-family:var(--serif); font-weight:400; font-size:1.2rem; margin:26px 0 12px; color:var(--amber)}
.day .when{color:var(--amber); font-weight:600; font-size:.95rem; margin:0 0 6px}
.day .note{color:var(--muted); margin:0 0 18px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:0 0 18px}
.photos{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; background:var(--chip); scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos figure{margin:0; flex:0 0 100%; scroll-snap-align:start; position:relative; aspect-ratio:16/10}
.photos img{width:100%; height:100%; object-fit:cover; display:block}
.photos .ph{display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:.92rem; padding:16px; text-align:center}
.photos.pending{height:0}
.credit:empty{display:none}
.halalline{font-size:.95rem; color:var(--muted)}
.halalline strong{color:var(--ink)}
.credit{font-size:.78rem; color:var(--muted); padding:6px 16px 0}
.credit a{color:var(--muted)}
.body{padding:14px 16px 16px}
.body h3{font-family:var(--serif); font-weight:400; font-size:1.3rem; margin:0 0 6px; line-height:1.2}
.body p{margin:0 0 10px}
.tip{color:var(--muted); font-size:.95rem}
.badge{display:inline-block; font-size:.82rem; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--amber); color:var(--amber); margin:0 0 10px}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.badge.closed{border-color:var(--bad); color:var(--bad); margin-right:6px}
.btn{display:inline-block; text-decoration:none; font-weight:600; font-size:.95rem; padding:10px 15px; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); min-height:44px}
button.btn{border:0; font-family:inherit; cursor:pointer}
button.btn.alt{border:1px solid var(--line)}
.steps{margin:0 0 6px; padding-left:22px}
.steps li{margin:0 0 6px}
.btn.alt{background:transparent; color:var(--ink); border:1px solid var(--line)}

.empty{border:1.5px dashed var(--line); border-radius:14px; padding:18px 16px; color:var(--muted); margin:0 0 18px}
.halal{background:var(--surface); border-left:4px solid var(--amber); border-radius:8px; padding:12px 14px; margin:0 0 18px; font-size:.95rem}

footer{padding:20px 16px 40px; text-align:center; color:var(--muted); font-size:.85rem}
</style>
</head>

function placeCard(p){

}

/* ---------- Google Maps export ----------
   Google Maps saved lists cannot be imported, so this builds a file for My Maps instead.
   Every place or venue with a pin in COORDS is included, grouped by day or meal. */
const DAY_COLOURS = ["#1e66f5","#2e9e44","#8e3fc7","#d6336c","#0f9d9a","#8a5a2b","#e6c200","#4c5bd4","#e03131"];
const FOOD_COLOUR = "#f08c00";
function exportStops(){
  const stops = [], skipped = [], seen = new Set();
  const add = (group, name, key, desc, colour, cat) => {
    key = key.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    const c = COORDS[key];
    if (!c) { skipped.push(name); return; }
    stops.push({group, cat, colour, name, desc, lat:c[0], lng:c[1], url:mapsUrl(name + " " + (key.includes("glasgow") ? "Glasgow" : "Edinburgh"))});
  };
  DAYS.forEach((d, i) => {
    const label = d.chip + " " + d.title, colour = DAY_COLOURS[i % DAY_COLOURS.length];
    d.places.forEach(p => add(label, p.name, p.q, [p.text, p.tip].filter(Boolean).join(" "), colour, label));
  });
  [["Edinburgh", FOOD], ["Glasgow", GLASGOW]].forEach(([city, F]) => {
    const item = (label, f) => add(city + " " + label, f.name, f.q || f.name + " " + city,
      [f.where, f.status, f.note].filter(Boolean).join(". "), FOOD_COLOUR, "Food");
    [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"]].forEach(([k, label]) => F[k].forEach(f => item(label, f)));
    Object.values(F.snacks).forEach(list => list.forEach(f => item("Snacks", f)));
  });
  return {stops, skipped};
}
const csvCell = v => '"' + String(v).replace(/"/g, '""') + '"';
function saveFile(name, type, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function downloadCsv(){
  const {stops} = exportStops();
  const rows = [["Name","Description","Latitude","Longitude","Colour by","Group","Link"]]
    .concat(stops.map(s => [s.name, s.desc, s.lat, s.lng, s.cat, s.group, s.url]));
  saveFile("edinburgh-trip-places.csv", "text/csv;charset=utf-8", "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"));
}
function downloadKml(){
  const {stops} = exportStops();
  const x = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const cats = [...new Set(stops.map(s => s.cat))], colourOf = c => stops.find(s => s.cat === c).colour;
  const kmlColour = h => "ff" + h.slice(5, 7) + h.slice(3, 5) + h.slice(1, 3);   // #rrggbb -> aabbggrr
  const styles = cats.map((c, i) => `  <Style id="s${i}"><IconStyle><color>${kmlColour(colourOf(c))}</color><scale>1.1</scale>
    <Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-blank.png</href></Icon></IconStyle></Style>`).join("\n");
  const marks = stops.map(s => `  <Placemark><name>${x(s.name)}</name><description>${x(s.desc + " " + s.url)}</description>
    <styleUrl>#s${cats.indexOf(s.cat)}</styleUrl>
    <ExtendedData><Data name="Colour by"><value>${x(s.cat)}</value></Data><Data name="Group"><value>${x(s.group)}</value></Data></ExtendedData>
    <Point><coordinates>${s.lng},${s.lat},0</coordinates></Point></Placemark>`).join("\n");
  saveFile("edinburgh-trip-places.kml", "application/vnd.google-earth.kml+xml",
    `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Edinburgh trip</name>\n${styles}\n${marks}\n</Document></kml>`);
}

    }
  };
  [["Edinburgh", FOOD, ""], ["Glasgow", GLASGOW, "g-"]].forEach(([city, F, pre], ci) => {
    const card = f => foodCard(f, city);
    const group = (label, items) => `<h3 class="sub">${label}</h3>` +
      (items.length ? items.map(card).join("") : `<p class="empty">Nothing confirmed yet.</p>`);
    const title = k => (ci ? city + " " : "") + k;
    [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"]].forEach(([k, label], i) => {
      chips += `<li${i===0 ? ' class="gap"' : ""}><a href="#${pre}${k}">${title(label)}</a></li>`;
      html += foodSection(pre + k, title(label), NOTES[city][k], F[k], F[k].length ? F[k].map(card).join("") : null);
    });
    const S = F.snacks;
    chips += `<li><a href="#${pre}snacks">${title("Snacks")}</a></li>`;
    html += foodSection(pre + "snacks", title("Snacks"), NOTES[city].snacks, [],
      group("Drinks and coffee", S.drinks) + group("Ice cream and desserts", S.icecream) +
      group("Cakes and bakes", S.cakes) + group("Sweets and candy", S.sweets));
  });

  chips += `<li class="gap"><a href="#maps">Google Maps</a></li>`;
  html += mapsSection();
  nav.innerHTML = chips;
  main.insertAdjacentHTML("beforeend", html);
  $("#dl-csv").onclick = downloadCsv;
  $("#dl-kml").onclick = downloadKml;
  highlightNav();
  watchPhotos();
}

function highlightNav(){
  const ul = $("#nav");
  const links = [...ul.querySelectorAll("a")];
  const map = new Map(links.map(a => [a.getAttribute("href").slice(1), a]));
  let current = null;
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const a = map.get(en.target.id);
      if (!a || a === current) return;
      if (current) current.classList.remove("on");
      current = a; a.classList.add("on");
      /* Move only the chip strip. scrollIntoView would also scroll the page and interrupt a swipe. */
      const want = a.offsetLeft - (ul.clientWidth - a.offsetWidth) / 2;
      requestAnimationFrame(() => { ul.scrollLeft = want; });
    });
  }, {rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("section.day").forEach(s => io.observe(s));
}

/* Wikipedia rate-limits bursts, so load at most two cards' photos at a time. */
const photoQueue = [];
let photoActive = 0;
function queuePhotos(el){
  photoQueue.push(el);
  pumpPhotos();
}
function pumpPhotos(){
  while (photoActive < 2 && photoQueue.length){
    const el = photoQueue.shift();
    photoActive++;
    Promise.resolve(loadPhotos(el)).catch(() => {}).finally(() => { photoActive--; pumpPhotos(); });
  }
}

/* Photos only start loading as a card nears the screen. */
function watchPhotos(){
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      queuePhotos(en.target);
    });
  }, {rootMargin:"600px 0px"});
  document.querySelectorAll(".photos[data-wiki], .photos[data-search]").forEach(el => io.observe(el));
}

/* ---------- Photos ----------
   Loaded live from Wikipedia. Two routes are tried, with a timeout, and a
   short reason is shown on the card if both fail. */
async function getJSON(url, ms){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 15000);
  try {
    let r = await fetch(url, {signal:c.signal});
    for (let wait = 1500; r.status === 429 && wait <= 6000; wait *= 2){   // rate-limited: back off and retry
      await new Promise(res => setTimeout(res, wait));
      r = await fetch(url, {signal:c.signal});
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* Venues without a Wikipedia page: search Wikimedia Commons and keep only files
   whose title contains every word of the venue name, so we never show a wrong place. */
const commonsCache = new Map();
let commonsQueue = Promise.resolve();
function commonsPhotos(term, name){
  const key = term.toLowerCase();
  /* One search at a time with a short gap, so Commons does not rate-limit a page full of cards. */
  if (!commonsCache.has(key)) commonsCache.set(key, commonsQueue = commonsQueue.catch(() => {}).then(async () => {
    await new Promise(r => setTimeout(r, 250));
    const norm = t => t.toLowerCase().replace(/\.[a-z]+$/, "").replace(/[^a-z0-9]+/g, " ").trim();
    /* the term is "venue name + city", so the city must be in the file title too */
    const words = norm(name.replace(/\(.*?\)/g, "") + " " + term.split(" ").pop()).split(" ").filter(Boolean);
    const d = await getJSON("https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch=" +
      encodeURIComponent(term) + "&prop=imageinfo&iiprop=url&iiurlwidth=960&format=json&origin=*");
    const pages = d.query && d.query.pages ? Object.values(d.query.pages) : [];
    return pages.filter(pg => {
      const ii = pg.imageinfo && pg.imageinfo[0];
      if (!ii || !/\.jpe?g$/i.test(pg.title)) return false;
      const t = " " + norm(pg.title.replace(/^File:/, "")) + " ";
      return words.every(w => t.includes(" " + w + " "));
    }).slice(0, 3).map(pg => ({src: pg.imageinfo[0].thumburl || pg.imageinfo[0].url, page: pg.imageinfo[0].descriptionurl}));
  }));
  return commonsCache.get(key);
}

async function loadCommons(el){
  const credit = el.nextElementSibling;
  let found = [];
  try { found = await commonsPhotos(el.dataset.search, el.dataset.name); } catch(e){}
  if (!found.length){
    if (el.classList.contains("pending")){ el.remove(); credit.remove(); }
    else { el.innerHTML = `<figure><div class="ph">No photo found here. Tap “More photos” to see pictures of this place.</div></figure>`; }
    return;
  }
  el.classList.remove("pending");
  el.innerHTML = found.map(f => `<figure><img src="${esc(f.src)}" alt="${esc(el.dataset.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"></figure>`).join("");
  credit.innerHTML = `Photos from <a href="${esc(found[0].page)}" target="_blank" rel="noopener">Wikimedia Commons</a>.${found.length > 1 ? " Swipe for more." : ""}`;
}

async function loadPhotos(el){
  if (!el.dataset.wiki) return loadCommons(el);
  const title = el.dataset.wiki;
  const name = el.closest(".card").querySelector("h3").textContent;
  const credit = el.nextElementSibling;
  const imgs = [], errs = [];
  let pageUrl = "https://en.wikipedia.org/wiki/" + wikiEnc(title);

  try {
    const d = await getJSON("https://en.wikipedia.org/api/rest_v1/page/summary/" + wikiEnc(title));
    if (d.thumbnail) imgs.push(bigger(d.thumbnail.source, 960));
    if (d.content_urls && d.content_urls.desktop) pageUrl = d.content_urls.desktop.page;
  } catch(e){ errs.push("summary: " + e.message); }

  if (!imgs.length){
    try {
      const d = await getJSON("https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=960&redirects=1&format=json&origin=*&titles=" + wikiEnc(title.replace(/_/g," ")));
      const pages = d.query && d.query.pages ? Object.values(d.query.pages) : [];
      if (pages[0] && pages[0].thumbnail) imgs.push(pages[0].thumbnail.source);
    } catch(e){ errs.push("api: " + e.message); }
  }

  try {
    const d = await getJSON("https://en.wikipedia.org/api/rest_v1/page/media-list/" + wikiEnc(title));
    for (const it of (d.items || [])){
      if (imgs.length >= 3) break;
      if (it.type !== "image" || !it.srcset || !it.srcset.length) continue;
      if (!/\.jpe?g$/i.test(it.title || "")) continue;
      let src = it.srcset[0].src; if (src.startsWith("//")) src = "https:" + src;
      src = bigger(src, 500);
      const base = u => u.split("/").slice(-1)[0].replace(/^\d+px-/, "");
      if (!imgs.some(u => base(u) === base(src))) imgs.push(src);
    }
  } catch(e){ errs.push("media: " + e.message); }

  if (!imgs.length && el.classList.contains("pending")){ el.remove(); credit.remove(); return; }
  if (!imgs.length){
    el.innerHTML = `<figure><div class="ph">Photos could not load here (${esc(errs[0] || "no image found")}). Tap “More photos”, or open this page in your normal browser.</div></figure>`;
    return;
  }
  el.classList.remove("pending");
  el.innerHTML = imgs.map(u => `<figure><img src="${esc(u)}" alt="${esc(name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"></figure>`).join("");
  credit.innerHTML = `Photos from <a href="${esc(pageUrl)}" target="_blank" rel="noopener">Wikipedia</a>. Swipe for more.`;
}

build();
</script>
