<style>
:root{

  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161e; --surface:#1b212c; --ink:#e9edf3; --muted:#a2adbc; --line:#2d3646;

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:72px; -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

.hero{position:relative; color:#fff; padding:calc(env(safe-area-inset-top,0px) + 36px) 20px 0;
  background:linear-gradient(180deg,var(--dusk1) 0%,var(--dusk2) 62%,var(--dusk3) 100%); overflow:hidden}
.hero h1{font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,11vw,4.4rem); line-height:1; margin:0 0 10px}
.hero p{margin:0; max-width:34ch; font-size:1.02rem; color:#f1e9f6}
.hero svg{display:block; width:calc(100% + 40px); margin:26px -20px 0; height:auto}
.wrap{max-width:760px; margin:0 auto; padding:0 16px}

nav{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
nav ul{list-style:none; margin:0 auto; padding:10px 16px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; max-width:760px}
nav ul::-webkit-scrollbar{display:none}
nav a{display:block; white-space:nowrap; text-decoration:none; background:var(--chip); color:var(--ink);
  padding:7px 13px; border-radius:999px; font-size:.92rem; font-weight:500}
nav a.on{background:var(--accent); color:var(--accent-ink)}
nav li.gap{margin-left:10px; padding-left:10px; border-left:1px solid var(--line)}

section.day{padding:34px 0 6px}
.day h2{font-family:var(--serif); font-weight:400; font-size:1.7rem; line-height:1.15; margin:0 0 6px}
.day h3.sub{font-family:var(--serif); font-weight:400; font-size:1.2rem; margin:26px 0 12px; color:var(--amber)}
.day .when{color:var(--amber); font-weight:600; font-size:.95rem; margin:0 0 6px}
.day .note{color:var(--muted); margin:0 0 18px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:0 0 18px}
.photos{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background:var(--chip); scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos figure{margin:0; flex:0 0 100%; scroll-snap-align:start; position:relative; aspect-ratio:16/10}
.photos img{width:100%; height:100%; object-fit:cover; display:block}
.photos .ph{display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:.92rem; padding:16px; text-align:center}
.credit{font-size:.78rem; color:var(--muted); padding:6px 16px 0}
.credit a{color:var(--muted)}
.body{padding:14px 16px 16px}
.body h3{font-family:var(--serif); font-weight:400; font-size:1.3rem; margin:0 0 6px; line-height:1.2}
.body p{margin:0 0 10px}
.tip{color:var(--muted); font-size:.95rem}
.badge{display:inline-block; font-size:.82rem; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--amber); color:var(--amber); margin:0 0 10px}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.btn{display:inline-block; text-decoration:none; font-weight:600; font-size:.95rem; padding:10px 15px; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); min-height:44px}
.btn.alt{background:transparent; color:var(--ink); border:1px solid var(--line)}

.empty{border:1.5px dashed var(--line); border-radius:14px; padding:18px 16px; color:var(--muted); margin:0 0 18px}
.halal{background:var(--surface); border-left:4px solid var(--amber); border-radius:8px; padding:12px 14px; margin:0 0 18px; font-size:.95rem}

.todo{list-style:none; padding:0; margin:0 0 30px}
.todo li{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin:0 0 8px}
.todo label{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; min-height:48px; cursor:pointer}
.todo input{width:22px; height:22px; margin-top:2px; accent-color:var(--accent); flex:none}
.todo input:checked + span{text-decoration:line-through; color:var(--muted)}
footer{padding:20px 16px 40px; text-align:center; color:var(--muted); font-size:.85rem}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
</head>

const TODO = [
  "Choose halal restaurants for each dinner and book the busy ones",
  "Book the Alpine coaster and check its weather policy",
  "Decide St Andrews or Stirling",

/* ================================================================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mapsUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const imagesUrl = q => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(q);
const wikiEnc = t => encodeURIComponent(t).replace(/'/g, "%27");
const bigger = (u, w) => u.replace(/\/\d+px-/, "/" + w + "px-");

function placeCard(p){
  const photoBlock = p.wiki
    ? `<div class="photos" data-wiki="${esc(p.wiki)}"><figure><div class="ph">Loading photos…</div></figure></div><div class="credit"></div>`
    : `<div class="photos"><figure><div class="ph">Tap “More photos” to see pictures of this place.</div></figure></div>`;
  return `<article class="card">
    ${photoBlock}
    <div class="body">
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.text)}</p>
      ${p.tip ? `<p class="tip">${esc(p.tip)}</p>` : ""}
      <div class="actions">
        <a class="btn" href="${esc(p.url || mapsUrl(p.q))}" target="_blank" rel="noopener">Open in Google Maps</a>
        <a class="btn alt" href="${imagesUrl(p.name + " " + p.q)}" target="_blank" rel="noopener">More photos</a>
      </div>
    </div></article>`;
}

function foodCard(f, city){
  return `<article class="card"><div class="body">
    <h3>${esc(f.name)}</h3>
    ${f.where ? `<p class="tip">${esc(f.where)}</p>` : ""}
    ${f.status ? `<span class="badge">${esc(f.status)}</span>` : ""}
    ${f.note ? `<p>${esc(f.note)}</p>` : ""}
    <div class="actions">
      <a class="btn" href="${mapsUrl(f.q || (f.name + " " + (typeof city === "string" ? city : "Edinburgh")))}" target="_blank" rel="noopener">Open in Google Maps</a>
      ${f.src ? `<a class="btn alt" href="${esc(f.src)}" target="_blank" rel="noopener">Halal info</a>` : ""}
    </div></div></article>`;
}

const HALAL_NOTE = `<p class="halal">Halal status can change, and “halal options” means only some items. Message or call to confirm before you book.</p>`;

function foodSection(id, title, note, items, extra){
  return `<section class="day" id="${id}">
    <h2>${title}</h2>
    <p class="note">${note}</p>
    ${id === "breakfast" ? HALAL_NOTE : ""}
    ${extra || (items.length ? items.map(foodCard).join("") : `<p class="empty">Nothing here yet.</p>`)}
  </section>`;
}

function build(){
  const nav = $("#nav"), main = $("#main");
  let html = "", chips = "";
  DAYS.forEach(d => {
    chips += `<li><a href="#${d.id}">${esc(d.chip)}</a></li>`;
    html += `<section class="day" id="${d.id}">
      <p class="when">${esc(d.date)}</p>
      <h2>${esc(d.title)}</h2>
      <p class="note">${esc(d.note)}</p>
      ${d.places.map(placeCard).join("")}
    </section>`;
  });
  const foodChips = [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snacks","Snacks"],["reels","My reels"],["todo","To do"]];
  foodChips.forEach(([id,label],i) => { chips += `<li${i===0?' class="gap"':''}><a href="#${id}">${label}</a></li>`; });

  html += foodSection("breakfast","Breakfast","Start the day with halal-friendly spots, mostly in the Old Town and Haymarket.", FOOD.breakfast);
  html += foodSection("lunch","Lunch","Quick, central and family-friendly, with one stop for the Glasgow day.", FOOD.lunch);
  html += foodSection("dinner","Dinner","Sit-down evenings, including picks for the farewell dinner on 17 December.", FOOD.dinner);

  const S = FOOD.snacks;
  const snackBody =
    `<h3 class="sub">Drinks and coffee</h3>${S.drinks.map(foodCard).join("")}
     <h3 class="sub">Ice cream and desserts</h3>${S.icecream.map(foodCard).join("")}
     <h3 class="sub">Cakes and bakes</h3>${S.cakes.map(foodCard).join("")}
     <h3 class="sub">Sweets and candy</h3>${S.sweets.map(foodCard).join("")}`;
  html += foodSection("snacks","Snacks","Warm drinks, sweet stops and treats between the sights.", [], snackBody);

  const R = FOOD.reels;
  const reelCity = (label, city, items) =>
    `<h3 class="sub">${label}</h3>` + (items.length ? items.map(f => foodCard(f, city)).join("") : `<p class="empty">No places added yet.</p>`);
  html += foodSection("reels","My reels","Places from your saved Instagram reels.", [],
    reelCity("Edinburgh", "Edinburgh", R.edinburgh) + reelCity("Glasgow", "Glasgow", R.glasgow));

  html += `<section class="day" id="todo"><h2>Still to do</h2><ul class="todo" id="todolist"></ul></section>`;

  nav.innerHTML = chips;
  main.insertAdjacentHTML("beforeend", html);
  buildTodo();
  highlightNav();
  document.querySelectorAll(".photos[data-wiki]").forEach(loadPhotos);
}

function buildTodo(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("edi-todo") || "{}"); } catch(e){}
  const ul = $("#todolist");
  ul.innerHTML = TODO.map((t,i) => `<li><label><input type="checkbox" data-i="${i}" ${saved[i] ? "checked" : ""}><span>${esc(t)}</span></label></li>`).join("");
  ul.addEventListener("change", e => {
    if (!e.target.matches("input")) return;
    saved[e.target.dataset.i] = e.target.checked;
    try { localStorage.setItem("edi-todo", JSON.stringify(saved)); } catch(err){}
  });
}

function highlightNav(){
  const links = [...document.querySelectorAll("#nav a")];
  const map = new Map(links.map(a => [a.getAttribute("href").slice(1), a]));
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){
        links.forEach(l => l.classList.remove("on"));
        const a = map.get(en.target.id);
        if (a){ a.classList.add("on"); a.scrollIntoView({inline:"center", block:"nearest"}); }
      }
    });
  }, {rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("section.day").forEach(s => io.observe(s));
}

/* ---------- Photos ----------
   Loaded live from Wikipedia. Two routes are tried, with a timeout, and a
   short reason is shown on the card if both fail. */
async function getJSON(url, ms){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 9000);
  try {
    const r = await fetch(url, {signal:c.signal});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function loadPhotos(el){
  const title = el.dataset.wiki;
  const name = el.closest(".card").querySelector("h3").textContent;
  const credit = el.nextElementSibling;
  const imgs = [], errs = [];
  let pageUrl = "https://en.wikipedia.org/wiki/" + wikiEnc(title);

  try {
    const d = await getJSON("https://en.wikipedia.org/api/rest_v1/page/summary/" + wikiEnc(title));
    if (d.thumbnail) imgs.push(bigger(d.thumbnail.source, 960));
    if (d.content_urls && d.content_urls.desktop) pageUrl = d.content_urls.desktop.page;
  } catch(e){ errs.push("summary: " + e.message); }

  if (!imgs.length){
    try {
      const d = await getJSON("https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=960&redirects=1&format=json&origin=*&titles=" + wikiEnc(title.replace(/_/g," ")));
      const pages = d.query && d.query.pages ? Object.values(d.query.pages) : [];
      if (pages[0] && pages[0].thumbnail) imgs.push(pages[0].thumbnail.source);
    } catch(e){ errs.push("api: " + e.message); }
  }

  try {
    const d = await getJSON("https://en.wikipedia.org/api/rest_v1/page/media-list/" + wikiEnc(title));
    for (const it of (d.items || [])){
      if (imgs.length >= 3) break;
      if (it.type !== "image" || !it.srcset || !it.srcset.length) continue;
      if (!/\.jpe?g$/i.test(it.title || "")) continue;
      let src = it.srcset[0].src; if (src.startsWith("//")) src = "https:" + src;
      src = bigger(src, 500);
      const base = u => u.split("/").slice(-1)[0].replace(/^\d+px-/, "");
      if (!imgs.some(u => base(u) === base(src))) imgs.push(src);
    }
  } catch(e){ errs.push("media: " + e.message); }

  if (!imgs.length){
    el.innerHTML = `<figure><div class="ph">Photos could not load here (${esc(errs[0] || "no image found")}). Tap “More photos”, or open this page in your normal browser.</div></figure>`;
    return;
  }
  el.innerHTML = imgs.map(u => `<figure><img src="${esc(u)}" alt="${esc(name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"></figure>`).join("");
  credit.innerHTML = `Photos from <a href="${esc(pageUrl)}" target="_blank" rel="noopener">Wikipedia</a>. Swipe for more.`;
}

build();
</script>
